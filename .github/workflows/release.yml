name: Prepare VSIX
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:verify
      - uses: actions/upload-artifact@v4
        with:
          name: repo-remote-inventory-vsix
          path: |
            release/*.vsix
            release/*.json
